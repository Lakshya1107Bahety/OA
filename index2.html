<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<h2>OA Risk Screening (Phone Sensor Test)</h2>
Age: <input id="age" type="number" value="55"><br>
Height(cm): <input id="height" type="number" value="170"><br>
Weight(kg): <input id="weight" type="number" value="80"><br>
Pain? <select id="pain"><option value="0">No</option><option value="1">Yes</option></select><br><br>
<button id="permBtn" onclick="requestPermission()">1. Enable Motion Sensor</button><br><br>
<button onclick="startRealTest()">2. Start 10s Walk Test</button>
<p id="status"></p>
<p id="result"></p>

<script>
document.write("Secure context: " + window.isSecureContext + "<br>");
let motionSamples = [];
let listening = false;

function requestPermission() {
  // iOS requires explicit permission; Android doesn't need this but the call is harmless
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(state => {
        if (state === 'granted') {
          document.getElementById("status").innerText = "Permission granted.";
        } else {
          document.getElementById("status").innerText = "Permission denied.";
        }
      })
      .catch(console.error);
  } else {
    document.getElementById("status").innerText = "No permission needed on this device.";
  }
}

function captureMotion(e) {
  let az = e.accelerationIncludingGravity.z;
  document.getElementById("status").innerText = "az: " + (az !== null ? az.toFixed(2) : "null");
  if (az !== null) motionSamples.push({ az: az, t: Date.now() });
}

function startRealTest() {
  motionSamples = [];
  document.getElementById("status").innerText = "Recording... walk now for 10s";
  document.getElementById("result").innerText = "";
  window.addEventListener('devicemotion', captureMotion);
  listening = true;

  setTimeout(() => {
    window.removeEventListener('devicemotion', captureMotion);
    listening = false;
    document.getElementById("status").innerText = "Done. Samples captured: " + motionSamples.length;
    let score = computeScore(motionSamples);
    document.getElementById("result").innerText = "Risk: " + score;
  }, 10000);
}

function computeScore(samples) {
  let age = +document.getElementById("age").value;
  let h = document.getElementById("height").value / 100;
  let w = +document.getElementById("weight").value;
  let bmi = w / (h * h);
  let pain = +document.getElementById("pain").value;

  let az = samples.map(s => s.az);
  let stepTimes = [];
  let last = 0;
  for (let i = 1; i < az.length - 1; i++) {
    if (az[i] > az[i-1] && az[i] > az[i+1] && az[i] > 10.5) {
      if (last) stepTimes.push(samples[i].t - last);
      last = samples[i].t;
    }
  }
  let steps = stepTimes.length;
  let mean = stepTimes.reduce((a,b)=>a+b,0) / steps || 0;
  let variance = stepTimes.reduce((a,b)=>a+(b-mean)**2,0) / steps || 0;
  let strideVar = Math.sqrt(variance);

  let score = 0;
  if (age > 45) score += 15;
  if (age > 60) score += 10;
  if (bmi > 25) score += 15;
  if (bmi > 30) score += 10;
  if (pain) score += 25;
  if (strideVar > 100) score += 15;
  if (steps < 8) score += 10;

  if (score >= 60) return "High (" + score + ")";
  if (score >= 30) return "Moderate (" + score + ")";
  return "Low (" + score + ")";
}
</script>
</body>
</html>
